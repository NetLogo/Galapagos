application.defaultEncoding=UTF-8

play.assets.path      = "/public"
play.assets.urlPrefix = "/assets"
play.cache.bindCaches = ["compilation-statuses"]
# Session signing secret. Default "changeme" is fine for dev (and Play refuses to
# start in prod mode with it), forcing prod/staging to supply a real value via the
# GALAPAGOS_HTTP_SECRET_KEY env var rather than committing one here.
play.http.secret.key  = "changeme"
play.http.secret.key  = ${?GALAPAGOS_HTTP_SECRET_KEY}
play.i18n.langs       = ["en"]
play.modules.enabled += "StartupModule"

# Port the embedded HubNet Web host frame is reached on (authoring "Test" feature).
# "" = standard port (prod), "8080" = dev default, "8443" = staging. Set via env.
hnw.framePort         = "8080"
hnw.framePort         = ${?HNW_FRAME_PORT}
